<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='600' viewBox='0 0 1200 600'>
<rect width='1200' height='600' fill='#fcfcfb'/>
<text x='24' y='30' fill='#0b0b0b' font-size='20' font-weight='700' font-family='-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif'>Loop vs graph: what decides it is whether errors are visible</text>
<text x='24' y='52' fill='#52514e' font-size='13' font-family='-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif'>Topology simulation, 20,000 runs per point. A loop retries errors it can see and builds on errors it cannot; a graph validates at each edge but only covers paths it anticipated.</text>
<text x='24' y='96' fill='#0b0b0b' font-size='17' font-weight='600' font-family='-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif'>A. Same error rate, different visibility (12-step task)</text>
<text x='24' y='116' fill='#52514e' font-size='12' font-family='-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif'>Loop falls 100% → 30% as errors go all-visible → all-silent. Winner flips near 12.5%.</text>
